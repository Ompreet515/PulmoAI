<!DOCTYPE html>
<html>
<head>
    <title>Grad-CAM | PulmoAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="gradcam">

<div class="container">

    {% include "navbar.html" %}

    <div class="card">
        <h1>Grad-CAM Explanation</h1>

        {% if explanations %}
        <div class="dual-container">

            {% if explanations.xray %}
            <div class="dual-column">
                <h3>Chest X-ray</h3>
                <img src="{{ url_for('static', filename='gradcam_xray.png') }}" class="explain-img">
                <p>{{ explanations.xray }}</p>
            </div>
            {% endif %}

            {% if explanations.ct %}
            <div class="dual-column">
                <h3>CT Scan</h3>
                <img src="{{ url_for('static', filename='gradcam_ct.png') }}" class="explain-img">
                <p>{{ explanations.ct }}</p>
            </div>
            {% endif %}

        </div>
        {% else %}
            <p>No Grad-CAM results available. Run prediction first.</p>
        {% endif %}
    </div>

</div>

</body>
</html>
